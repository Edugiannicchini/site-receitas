<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receitas do Edu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🍳 Receitas Rápidas & Práticas</h1>
    <p>Encontre as melhores receitas para o dia a dia</p>
    <input type="text" id="search-input" placeholder="Pesquisar receita ou ingrediente..." onkeyup="filtrarReceitas()">
  </header>

  <main class="container" id="receitas-container">
    <!-- As receitas serão inseridas via JavaScript -->
  </main>

  <!-- Modal para exibir detalhes da receita -->
  <div id="modal-container" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="fecharModal()">&times;</span>
      <h2 id="modal-titulo"></h2>
      <img id="modal-imagem" src="" alt="Imagem da receita">
      
      <h3>🛒 Ingredientes</h3>
      <ul id="modal-ingredientes"></ul>

      <h3>👨‍🍳 Modo de Preparo</h3>
      <ol id="modal-preparo"></ol>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
